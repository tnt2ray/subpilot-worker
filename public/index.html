<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light"><title>SubPilot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#status" aria-label="SubPilot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-7 8 7 8m6-16 7 8-7 8"/></svg>SubPilot</a>
    <nav id="navigation" aria-label="主导航"></nav>
    <div class="sidebar-bottom"><button id="language">中文 / EN</button><button id="logout" class="quiet">退出登录</button><span id="sidebar-version" class="sidebar-version" aria-live="polite"></span></div>
  </aside>
  <div class="workspace">
    <header class="page-header"><div class="heading"><button id="menu" class="icon-button mobile-only" aria-label="菜单">☰</button><h1 id="page-title">SubPilot</h1></div><div id="header-actions"></div></header>
    <div id="migration-banner" hidden></div>
    <main id="content" aria-live="polite"><p class="muted">正在读取配置…</p></main>
  </div>
  <footer class="save-bar"><span id="save-status" role="status"></span><div><button id="save" class="primary">保存配置</button></div></footer>
  <aside class="drawer" id="diagnostics" role="dialog" aria-modal="true" aria-labelledby="diagnostics-title" hidden><header><h2 id="diagnostics-title">迁移问题</h2><button class="icon-button" id="close-diagnostics" aria-label="关闭">×</button></header><div id="diagnostic-items"></div></aside>
  <dialog id="modal"><header><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="关闭">×</button></header><div id="modal-body"></div><footer id="modal-actions"></footer></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
